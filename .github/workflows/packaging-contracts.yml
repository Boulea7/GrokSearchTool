name: Packaging Contracts

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - codex/**

jobs:
  packaging-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install development dependencies
        run: uv sync --extra dev

      - name: Run packaging and docs contract tests
        if: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' && github.head_ref != 'stack/dr3-10-live-quality-release-ci' }}
        run: |
          uv run --with pytest --with pytest-asyncio pytest -q \
            tests/test_package_imports.py \
            tests/test_docs_contracts.py

      - name: Run packaging, docs, and deep research contract tests
        if: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' || github.head_ref == 'stack/dr3-10-live-quality-release-ci' }}
        run: |
          uv run --with pytest --with pytest-asyncio pytest -q \
            tests/test_package_imports.py \
            tests/test_docs_contracts.py \
            tests/test_deep_research_store.py \
            tests/test_deep_research_runtime.py \
            tests/test_deep_research_server.py \
            tests/test_deep_research_cli.py

      - name: Build wheel and sdist
        run: uv build --wheel --sdist

      - name: Run built artifact smoke checks
        run: |
          set -euo pipefail
          export GROK_DEEP_RESEARCH_DIR="$PWD/.tmp-ci-deep-research"
          python -m venv .venv-wheel-smoke
          . .venv-wheel-smoke/bin/activate
          python -m pip install dist/*.whl
          python -c "import grok_search.planning; import grok_search.server; from grok_search.server import main; print(callable(main))"
          python -c "import grok_search.deep_research_runtime; import grok_search.deep_research_store"
          python -m grok_search.deep_research_cli --help
          grok-search-research --help
          deactivate
          python -m venv .venv-sdist-smoke
          . .venv-sdist-smoke/bin/activate
          python -m pip install dist/*.tar.gz
          python -c "import grok_search.planning; import grok_search.server; from grok_search.server import main; print(callable(main))"
          python -c "import grok_search.deep_research_runtime; import grok_search.deep_research_store"
          python -m grok_search.deep_research_cli --help
          grok-search-research --help
