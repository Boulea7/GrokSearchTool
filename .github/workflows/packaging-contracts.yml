name: Packaging Contracts

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  push:
    branches:
      - main
      - codex/**

jobs:
  packaging-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-dependency-glob: pyproject.toml
          cache-suffix: packaging-contracts

      - name: Install development dependencies
        run: uv sync --extra dev

      - name: Run packaging, docs, and deep research contract tests
        run: |
          uv run --with pytest --with pytest-asyncio pytest -q \
            tests/test_package_imports.py \
            tests/test_docs_contracts.py \
            tests/test_deep_research_store.py \
            tests/test_deep_research_runtime.py \
            tests/test_deep_research_server.py \
            tests/test_deep_research_cli.py

      - name: Run release-surface focused regressions
        run: |
          uv run --with pytest --with pytest-asyncio pytest -q \
            tests/test_config.py \
            tests/test_server.py \
            tests/test_planning.py \
            tests/test_deep_research_eval.py \
            -k 'config_info or tavily_fallback or call_tavily_extract or plan_ or provider_attempts or provider_budget or selective_fetch or artifact_batch or public_surface or continuation or RecoveryCheckpoint or recoverycheckpoint'

      - name: Build wheel and sdist
        run: uv build --wheel --sdist

      - name: Run built artifact smoke checks
        run: |
          set -euo pipefail
          export GROK_DEEP_RESEARCH_DIR="$PWD/.tmp-ci-deep-research"
          python -m venv .venv-wheel-smoke
          . .venv-wheel-smoke/bin/activate
          python -m pip install dist/*.whl
          python -c "import grok_search.planning; import grok_search.server; from grok_search.server import main; print(callable(main))"
          python -c "import grok_search.deep_research_runtime; import grok_search.deep_research_store"
          python -m grok_search.deep_research_cli --help
          grok-search-research --help
          deactivate
          python -m venv .venv-sdist-smoke
          . .venv-sdist-smoke/bin/activate
          python -m pip install dist/*.tar.gz
          python -c "import grok_search.planning; import grok_search.server; from grok_search.server import main; print(callable(main))"
          python -c "import grok_search.deep_research_runtime; import grok_search.deep_research_store"
          python -m grok_search.deep_research_cli --help
          grok-search-research --help
