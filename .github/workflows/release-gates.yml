name: Release Gates

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  push:
    branches:
      - main
      - codex/**

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-dependency-glob: pyproject.toml
          cache-suffix: release-gates-lint
          save-cache: false

      - name: Run ruff
        run: uv run --with ruff python -m ruff check .

  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-dependency-glob: pyproject.toml
          cache-suffix: release-gates-compile
          save-cache: false

      - name: Compile Python files
        run: uv run python -m compileall -q src tests

  tests-full:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-dependency-glob: pyproject.toml
          cache-suffix: release-gates-tests-full
          save-cache: false

      - name: Install development dependencies
        run: uv sync --extra dev

      - name: Run full pytest suite
        env:
          GROK_DEEP_RESEARCH_DIR: ${{ runner.temp }}/grok-search-deep-research
        run: uv run --with pytest --with pytest-asyncio pytest -q
